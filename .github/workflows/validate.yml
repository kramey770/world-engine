name: Validate

"on": [push, pull_request]

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check package manager policy
        run: pnpm check:package-manager

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm lint

      - name: Build application
        run: pnpm build

      - name: Build icons
        run: pnpm icons:build