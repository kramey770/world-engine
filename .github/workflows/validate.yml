name: Validate

"on": [push, pull_request]

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check package manager policy
        run: pnpm check:package-manager

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm typecheck

      - name: Build application
        run: pnpm build

      - name: Build icons
        run: pnpm icons:build

      - name: Typecheck icons
        run: pnpm --filter ./world-engine-icons typecheck

  map-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: map-generator-source/pnpm-lock.yaml

      - name: Install map source dependencies
        run: pnpm --dir map-generator-source --ignore-workspace install --frozen-lockfile

      - name: Build map source
        run: pnpm --dir map-generator-source --ignore-workspace run build

      - name: Check generated runtime
        run: node scripts/sync-map-runtime.cjs --check

  armoria:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: armoria/pnpm-lock.yaml

      - name: Install Armoria dependencies
        run: pnpm install --frozen-lockfile
        working-directory: armoria

      - name: Check Armoria
        run: pnpm run check
        working-directory: armoria

      - name: Build Armoria
        run: pnpm run build
        working-directory: armoria